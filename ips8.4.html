<!DOCTYPE html>
<html>
<body>

<form>
<input type="text" id="roll" placeholder="Roll No"><br><br>
<input type="text" id="sname" placeholder="Name"><br><br>
<input type="text" id="dept" placeholder="Department"><br><br>

Gender:
<input type="radio" name="gender" value="Male">Male
<input type="radio" name="gender" value="Female">Female<br><br>

Semester:
<select id="sem">
  <option value="1">Sem 1</option>
  <option value="2">Sem 2</option>
  <option value="3">Sem 3</option>
</select><br><br>

<input type="number" id="m1" placeholder="Mark 1"><br><br>
<input type="number" id="m2" placeholder="Mark 2"><br><br>
<input type="number" id="m3" placeholder="Mark 3"><br><br>

<button type="button" onclick="result()">Submit</button>
</form>

<p id="out"></p>

<script>
function result() {
  let m1 = parseInt(document.getElementById("m1").value);
  let m2 = parseInt(document.getElementById("m2").value);
  let m3 = parseInt(document.getElementById("m3").value);

  let total = m1 + m2 + m3;
  let avg = total / 3;
  let grade = "F";

  if (m1>=50 && m2>=50 && m3>=50) {
    if (avg>=90) grade="A";
    else if (avg>=80) grade="B";
    else if (avg>=70) grade="C";
    else if (avg>=60) grade="D";
    else if (avg>=50) grade="E";
  }

  let g = document.querySelector('input[name="gender"]:checked').value;

  document.getElementById("out").innerHTML =
  "Roll No: " + document.getElementById("roll").value + "<br>" +
  "Name: " + document.getElementById("sname").value + "<br>" +
  "Department: " + document.getElementById("dept").value + "<br>" +
  "Gender: " + g + "<br>" +
  "Semester: " + document.getElementById("sem").value + "<br>" +
  "Total: " + total + "<br>" +
  "Average: " + avg.toFixed(2) + "<br>" +
  "Grade: " + grade;
}
</script>

</body>
</html>
