<!DOCTYPE html>
<html>
<body>

<input type="number" id="a" placeholder="Number 1"><br><br>
<input type="number" id="b" placeholder="Number 2"><br><br>

<select id="op" onchange="calc()">
  <option value="">Select Operation</option>
  <option value="add">Addition</option>
  <option value="sub">Subtraction</option>
  <option value="mul">Multiplication</option>
  <option value="div">Division</option>
</select><br><br>

<p id="res"></p>

<script>
function calc() {
  let x = parseFloat(document.getElementById("a").value);
  let y = parseFloat(document.getElementById("b").value);
  let op = document.getElementById("op").value;
  let r = "";

  if (op === "add") r = x + y;
  else if (op === "sub") r = x - y;
  else if (op === "mul") r = x * y;
  else if (op === "div") r = x / y;

  document.getElementById("res").innerText = "Result: " + r;
}
</script>

</body>
</html>
