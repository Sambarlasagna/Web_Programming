<!DOCTYPE html>
<html>
<head>
    <style>
        .box {
            width: 400px;
            border: 2px solid orange;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .header {
            background-color: orange;
            color: white;
            text-align: center;
            font-weight: bold;
            padding: 15px;
            font-size: 20px;
        }

        .content {
            padding: 15px;
        }

        .content ul {
            list-style-type: disc;
        }

        .content li {
            color: blue;
            margin-bottom: 8px;
        }
    </style>

</head>
<body>

    <div class="box">
        <div class="header">
            LEARN DATA SCIENCE!
        </div>

        <div class="content">
            <ul>
                <li>Unlimited jobs</li>
                <li>Best benefits anywhere</li>
                <li>Call now for an appointment</li>
            </ul>
        </div>
    </div>

</body>
</html>
